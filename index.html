<style>
/* Layout: phone-first single column, sticky date header, fixed bottom tab bar. Feel: a ward obs chart crossed with a gym logbook. */
/* Deliberately single-theme: a dark game HUD with cyan system windows. */
:root{
  --bg:#060A12; --surface:#0C1422; --ink:#E6F0FF; --muted:#8597B3; --line:#1C2B44;
  --accent:#38BDF8; --accent-soft:#0B2338; --edge:#38BDF880; --violet:#A78BFA;
  --amber:#F5B544; --amber-soft:#33250C;
  --good:#4ADE80; --warn:#F5B544; --bad:#F87171; --bad-soft:#2E1114;
  --display:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px; color-scheme:dark;
}
.sys{border:1px solid var(--edge);border-radius:6px;background:linear-gradient(180deg,var(--accent-soft),var(--surface) 60%);box-shadow:0 0 24px -8px var(--accent);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sys-h{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--accent);border-bottom:1px solid var(--edge);padding-bottom:8px}
.sys-top{display:flex;gap:12px;align-items:center}
.rank{width:58px;height:58px;display:grid;place-items:center;font-family:var(--display);font-size:36px;font-weight:700;border:2px solid var(--accent);border-radius:6px;color:var(--accent);text-shadow:0 0 14px var(--accent);flex:none}
.lv{font-family:var(--display);font-size:26px;font-weight:700}
.bar.xp i{background:linear-gradient(90deg,var(--accent),var(--violet));box-shadow:0 0 10px var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.statgrid div{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;background:var(--bg)}
.statgrid b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.statgrid span{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:grid;grid-template-columns:1fr auto 26px;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.qlist li:first-child{border-top:0}
.qlist li.ok .qn{color:var(--muted)}
.qv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
.qmark{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--good);font-weight:700;font-size:14px}
.qlist li.ok .qmark{border-color:var(--good);box-shadow:0 0 10px -2px var(--good)}
.pen{border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--bad-soft)}
.cleared{color:var(--good)}
#lvlup{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000B;padding:24px}
#lvlup .sys{max-width:320px;width:100%;text-align:center;animation:pop .35s ease-out}
#lvlup .big{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-shadow:0 0 18px var(--accent);line-height:1.1}
@keyframes pop{from{transform:scale(.92);opacity:.5}to{transform:none;opacity:1}}
.brand{display:flex;gap:10px;align-items:center}
.rk{width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--accent);border-radius:5px;color:var(--accent);font-size:20px;text-shadow:0 0 10px var(--accent);flex:none}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav span{font-weight:600;font-size:14px;min-width:92px;text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input[type=number]{width:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
/* gauges */
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gauge .lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gauge .val{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.gauge .val small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar.amber i{background:var(--amber)}
.bar.over i{background:var(--bad)}
.gauge .sub{font-size:12px;color:var(--muted)}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper .btn{padding:5px 9px;font-size:13px}
/* habits */
.habits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.habits li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.habits li:first-child{border-top:0}
.tick{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;flex:none;cursor:pointer;background:var(--bg);padding:0}
.tick:checked{background:var(--accent);border-color:var(--accent)}
.tick:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.habits li.done span{color:var(--muted);text-decoration:line-through}
.auto{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:99px;margin-left:auto;white-space:nowrap}
/* food */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 10px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:baseline}
.chip b{font-weight:600}
.chip em{font-style:normal;color:var(--muted);font-size:12px}
.chip.meal{background:var(--accent-soft);border-color:transparent}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:1fr auto auto 28px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .k{color:var(--muted);text-align:right;min-width:62px}
.log .p{color:var(--amber);font-weight:600;text-align:right;min-width:44px}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* train */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-weight:600;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.ex .spread b{font-size:15px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sys .ex{border-top-color:var(--line)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alerts:empty{display:none}
.alert{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:7px 10px;font-size:13px;background:var(--bg)}
.alert span{color:var(--muted)}
.alert.ok{border-left-color:var(--good)}.alert.ok b{color:var(--good)}
.alert.warn{border-left-color:var(--amber)}.alert.warn b{color:var(--amber)}
.alert.bad{border-color:var(--bad);border-left-width:3px;background:var(--bad-soft)}.alert.bad b{color:var(--bad)}
.set{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.set input{width:52px;padding:6px 6px;text-align:center}
.last{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
.stat .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chartbox{overflow-x:auto}
svg text{font-family:var(--body)}
.miles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mile{border:1px dashed var(--line);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.mile b{font-family:var(--display);font-size:20px}
.mile span{font-size:11px;color:var(--muted)}
.mile.hit{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:6px 6px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-top:0}
.review{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.review b{text-align:right}
.verdict{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--accent-soft)}
.verdict.warn{background:var(--amber-soft)}
/* shop */
.shopgrp{display:flex;flex-direction:column;gap:2px}
.shopgrp label{display:flex;gap:12px;align-items:center;padding:7px 0;font-size:14px;cursor:pointer}
.shopgrp label.got span{color:var(--muted);text-decoration:line-through}
.shopgrp label i{font-style:normal;color:var(--muted);margin-left:auto;font-size:13px;white-space:nowrap}
/* plan */
.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.targets input{width:100%}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week div{background:var(--bg);border-radius:8px;padding:6px 2px;font-size:11px;line-height:1.3}
.week div b{display:block;font-size:12px}
.week div.today{outline:2px solid var(--accent)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.sync{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:380px){.gauge .val{font-size:26px}.stats .stat .v{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<script>
/* ---------- plan data ---------- */
const DEFAULTS={start:120,goal:80,kcal:2200,protein:160,water:3000,steps:8000};
const HABITS=[
 ["weigh","Weigh in on waking"],["log","Log everything you eat"],["protein","Hit protein target"],
 ["water","Drink water target"],["steps","Hit step target"],["sleep","7–8 h sleep"],["late","Nothing 2–3 h before bed"]];
const MEALS=[
 {n:"Breakfast: oats, whey, berries, yoghurt",k:480,p:45},
 {n:"Lunch: chicken, rice, veg, oil",k:595,p:53},
 {n:"Snack: tuna, rice crackers, carrot",k:180,p:23},
 {n:"Dinner: beef mince, potato, salad",k:455,p:39},
 {n:"Evening: skim milk + fruit",k:170,p:9}];
const FOODS=[
 {n:"Oats 50 g",k:190,p:6},{n:"Whey 1 scoop",k:120,p:24},{n:"Greek yoghurt 150 g",k:110,p:15},
 {n:"Chicken breast 150 g cooked",k:250,p:46},{n:"Beef mince 5% 150 g raw",k:200,p:32},{n:"Tuna 95 g tin",k:100,p:22},
 {n:"Eggs × 3",k:220,p:19},{n:"Rice 150 g cooked",k:195,p:4},{n:"Potato 200 g",k:150,p:4},
 {n:"Wrap × 1",k:120,p:4},{n:"Veg 2 cups",k:60,p:3},{n:"Fruit 1 piece",k:80,p:1},
 {n:"Skim milk 250 ml",k:90,p:9},{n:"Olive oil 10 ml",k:90,p:0},{n:"Protein bar",k:210,p:20},
 {n:"Skim flat white",k:80,p:6}];
const WORKOUTS={
 A:[["Goblet squat",3,"10–12"],["Dumbbell bench press",3,"8–12"],["Lat pulldown",3,"10–12"],["Romanian deadlift",3,"10"],["Seated shoulder press",2,"10–12"],["Plank (sec)",3,"20–40 s"]],
 B:[["Leg press",3,"12"],["Seated cable row",3,"10–12"],["Incline dumbbell press",3,"10–12"],["Hip thrust",3,"12"],["Step-ups",2,"10 each leg"],["Dead bug",3,"10 each side"]]};
const SHOP={
 Protein:[["Chicken breast","1.4 kg"],["Lean beef mince 5%","1 kg"],["Tuna in springwater","7 × 95 g"],["Eggs","1 dozen"],["Greek yoghurt","1 kg"],["Skim milk","2 L"],["Whey protein","1 kg (≈5 wk)"]],
 Carbs:[["Rolled oats","750 g (2 wk)"],["Rice","1 kg (2–3 wk)"],["Potatoes","2 kg"],["Rice crackers","1 pack"],["Wholemeal wraps","1 pack"]],
 Veg:[["Frozen mixed veg","1 kg"],["Broccoli","2 heads"],["Baby spinach","280 g"],["Carrots","1 kg"],["Capsicum","3"],["Tomatoes, cucumber, lettuce","4 · 2 · 1"],["Onions + garlic",""]],
 Fruit:[["Frozen mixed berries","1 kg"],["Bananas","6"],["Apples or mandarins","6"]],
 Extras:[["Olive oil spray + oil",""],["Salsa, soy, mustard, spices",""],["Popcorn kernels",""],["Sparkling / zero drinks",""]]};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
function weekNo(s){const d=parse(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function fixedPlan(s){const dw=parse(s).getDay(),odd=weekNo(s)%2;
 if(dw===1||dw===5)return odd?"B":"A"; if(dw===3)return odd?"A":"B";
 if(dw===2||dw===4)return"walk"; if(dw===6)return"badminton"; return"rest"}
const SHIFTS=[["am","AM"],["pm","PM"],["night","Night"],["off","Off"]];
const weekStart=s=>addDays(s,-((parse(s).getDay()+6)%7));
function planWeek(mon){
 const R=S.roster||{},days=Array.from({length:7},(_,i)=>addDays(mon,i)),sh=days.map(d=>R[d]||"");
 if(!sh.some(Boolean))return days.map(fixedPlan);
 const pn=i=>R[addDays(days[i],-1)]==="night";
 const score=days.map((d,i)=>{const s=sh[i];if(s==="night")return -1;if(pn(i))return 0;return({off:3,am:2,pm:1.5,"":2})[s]});
 const order=[...days.keys()].filter(i=>score[i]>=1).sort((a,b)=>score[b]-score[a]||a-b);
 const pick=[];for(const i of order)if(pick.length<3&&!pick.some(j=>Math.abs(j-i)<2))pick.push(i);
 for(const i of order)if(pick.length<3&&!pick.includes(i))pick.push(i);
 pick.sort((a,b)=>a-b);
 const out=days.map((d,i)=>sh[i]==="night"?"rest":"walk");
 pick.forEach((i,n)=>out[i]=((n+weekNo(mon)%2)%2)?"B":"A");
 const offs=[...days.keys()].filter(i=>!pick.includes(i)&&sh[i]==="off"&&!pn(i));
 if(offs.length)out[offs[offs.length-1]]="badminton";
 if(!out.includes("rest")){const ri=[...days.keys()].reverse().find(i=>out[i]==="walk");if(ri!=null)out[ri]="rest"}
 return out}
function scheduled(s){return planWeek(weekStart(s))[(parse(s).getDay()+6)%7]}
function shiftTip(d){const R=S.roster||{},s=R[d],pn=R[addDays(d,-1)]==="night";
 if(s==="night")return"Night shift: no session today. A 20 min walk before you leave if you slept well.";
 if(pn)return"Coming off a night: sleep first, then a 20 min walk. No strength today.";
 if(s==="am")return"AM shift: train after work, around 4–5 pm, after a protein snack.";
 if(s==="pm")return"PM shift: train in the morning and finish at least 2 h before you start.";
 if(s==="off")return"Day off: train whenever suits you. Good day for badminton or a longer walk.";
 return"Set today's shift and the week re-plans around your roster."}
const SHIFT_WIN={am:[[15,30],[20,0]],pm:[[6,30],[13,0]],off:[[8,0],[20,0]],"":[[6,0],[20,0]]};
function at(d,h,m){const x=parse(d);x.setHours(h,m,0,0);return x}
function fmtLeft(ms){ms=Math.max(0,ms);const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h?`${h}h ${pad(m)}m`:`${m}m`}
function trainWindow(d){const R=S.roster||{},s=R[d]||"";if(s==="night"||R[addDays(d,-1)]==="night")return null;const w=SHIFT_WIN[s]||SHIFT_WIN[""];return{open:at(d,...w[0]),close:at(d,...w[1])}}
const warned={};
function tick(){const els=document.querySelectorAll("[data-alerts]");if(!els.length||!day)return;
 if(cur!==TODAY){els.forEach(e=>e.innerHTML="");return}
 const now=new Date(),end=at(TODAY,0,0);end.setDate(end.getDate()+1);const left=end-now;
 const it=questItems(day),rem=it.filter(i=>i.v<i.t),q=!rem.length,out=[];
 if(q)out.push(["ok","Daily quest cleared","next quest in "+fmtLeft(left)]);
 else out.push([left<72e5?"bad":left<216e5?"warn":"","Quest closes in "+fmtLeft(left),rem.length+" line"+(rem.length>1?"s":"")+" left"]);
 const win=trainWindow(TODAY),td=trainDone(day);
 if(!td&&day.workout.type!=="rest"&&win){
  if(now<win.open)out.push(["","Training window opens in "+fmtLeft(win.open-now),planLabel(day.workout.type)]);
  else if(now<win.close)out.push([win.close-now<36e5?"bad":"warn","Training window closes in "+fmtLeft(win.close-now),planLabel(day.workout.type)]);
  else out.push(["warn","Training window passed","fit a 20 min walk in before bed"])}
 if(!condOff(TODAY)&&!condDone(day)){const t=condTargets(),c=day.cond||{},lb={push:"push-ups",squat:"squats",core:"core",walk:"km"};
  const parts=COND.map(([k])=>{const r=Math.round(Math.max(0,t[k]-(c[k]||0))*10)/10;return r?r+" "+lb[k]:""}).filter(Boolean);out.push(["","Conditioning left",parts.join(" · ")])}
 const html=out.map(([c,a,b])=>`<div class="alert ${c}"><b class="num">${a}</b><span class="num">${esc(b)}</span></div>`).join("");
 els.forEach(e=>e.innerHTML=html);
 if(!q&&left<72e5&&!warned.q){warned.q=1;toast("Quest closes in under 2 hours")}
 if(win&&!td&&now<win.close&&win.close-now<18e5&&!warned.t){warned.t=1;toast("Training window closes in 30 minutes")}}
function calErr(e){const c=e&&e.code;
 if(c==="approval_required"||c==="not_granted"||c==="consent_denied")return"Allow Google Calendar for this page, then tap again.";
 if(c==="server_not_connected"||c==="selection_required")return"Connect Google Calendar in your claude.ai connector settings first.";
 if(c==="needs_reauth")return"Reconnect Google Calendar in your claude.ai connector settings.";
 return"Couldn't add the alerts"+(c?" ("+c+")":"")+". Try again in a minute."}

 st.textContent="Adding reminders…";S.calSent=S.calSent||{};let n=0;

  if(plan!=="rest"&&win&&!S.calSent[d+"t"]){const e=new Date(win.open.getTime()+60*6e4);

   catch(err){saveState();st.textContent=(n?`Added ${n}, then stopped. `:"")+calErr(err);return}}}
 saveState();st.textContent=n?`Added ${n} reminders to Google Calendar for the next 7 days.`:"Your next 7 days of reminders are already in Google Calendar."}

/* ---------- storage: private cloud rows when available, this device otherwise ---------- */
const store={mode:"local",db:null,uid:null,timers:{},busy:{},pending:{},
 async init(){
  try{
   if(window.claude&&typeof window.claude.use==="function"){
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(db&&user){const id=await user.id(); if(id){this.db=db;this.uid=id;this.mode="cloud"}}
   }
  }catch(e){}
 },
 ref(key){return this.db.collection("data/users/"+this.uid).doc(key)},
 lget(key){try{const v=localStorage.getItem("cut:"+key);return v?JSON.parse(v):null}catch(e){return null}},
 lset(key,v){try{localStorage.setItem("cut:"+key,JSON.stringify(v))}catch(e){}},
 async get(key){
  if(this.mode==="cloud"){try{const s=await this.ref(key).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null}catch(e){return this.lget(key)}}
  return this.lget(key)},
 save(key,val){ this.lset(key,val); if(this.mode!=="cloud")return;
  this.pending[key]=val; clearTimeout(this.timers[key]);
  this.timers[key]=setTimeout(()=>this.flush(key),700)},
 async flush(key){
  if(this.busy[key]||!this.pending[key])return;
  const v=this.pending[key]; delete this.pending[key]; this.busy[key]=true; setSync("Saving…");
  try{await this.ref(key).set(v); setSync("Synced to your account")}
  catch(e){ if(e&&e.code==="unavailable"){this.pending[key]=this.pending[key]||v; setTimeout(()=>this.flush(key),1500+Math.random()*1500)}
   else setSync("Couldn't sync — saved on this device") }
  this.busy[key]=false; if(this.pending[key])this.flush(key)},
 async range(from,to){ // day docs in [from,to]
  const out={};
  if(this.mode==="cloud"){try{const q=await this.db.collection("data/users/"+this.uid).where("date",">=",from).get();
    q.docs.forEach(d=>{const v=d.data();if(v&&v.date&&v.date<=to)out[v.date]=v});return out}catch(e){}}
  for(let s=from;s<=to;s=addDays(s,1)){const v=this.lget("d-"+s);if(v)out[s]=v}
  return out}
};

const RANKS=["E","D","C","B","A","S"];
function rankIdx(){const st=T(),lt=latestTrend();if(lt==null)return 0;const step=(st.start-st.goal)/5;return Math.max(0,Math.min(5,Math.floor((st.start-lt+1e-9)/step)))}
function levelInfo(){const lt=latestTrend();let xp=Object.values(S.log||{}).reduce((a,e)=>a+(e.xp||0),0);
 if(lt!=null)xp+=Math.max(0,Math.round((T().start-lt)*40));
 let level=1,need=100,left=xp;while(left>=need){left-=need;level++;need=100+20*(level-1)}
 return{level,into:left,need,total:xp}}
function stats(){const L=Object.values(S.log||{}),c=k=>L.filter(e=>e[k]).length;
 return{STR:10+c("str")*2+c("cd"),END:10+c("cr")+c("st")+c("cd"),VIT:10+c("sl")+c("wa"),DIS:10+c("q")*2}}
function penalty(d){const y=addDays(d,-1);return !!(S.since&&y>=S.since&&!(S.log[y]&&S.log[y].q))}
function questItems(d){const st=T(),t=d.foods.reduce((a,f)=>({k:a.k+f.k,p:a.p+f.p}),{k:0,p:0});
 const wt=d.workout.manual?d.workout.type:scheduled(d.date),pen=penalty(d.date);
 return[
  {k:"weigh",n:"Weigh in",v:S.weights[d.date]?1:0,t:1,txt:S.weights[d.date]?S.weights[d.date]+" kg":"Today tab"},
  {k:"protein",n:"Protein",v:t.p,t:st.protein,txt:t.p+" / "+st.protein+" g"},
  {k:"kcal",n:"Calories on target",v:(d.foods.length>=3&&t.k<=st.kcal&&t.k>=st.kcal-600)?1:0,t:1,txt:t.k+" / "+st.kcal},
  {k:"water",n:"Water",v:d.water,t:st.water,txt:(d.water/1000).toFixed(1)+" / "+st.water/1000+" L"},
  {k:"steps",n:pen?"Steps + recovery":"Steps",v:d.steps,t:st.steps+(pen?2000:0),txt:d.steps.toLocaleString()+" / "+(st.steps+(pen?2000:0)).toLocaleString()},
  {k:"train",n:wt==="rest"?"Rest and recover":planLabel(wt),v:wt==="rest"||d.workout.done?1:0,t:1,txt:wt==="rest"?"":d.workout.done?"done":"Train tab"},
  {k:"cond",n:"Conditioning quest",v:condDone(d)?1:0,t:1,txt:condOff(d.date)?"skipped":condParts(d).filter(p=>p.v>=p.t).length+" / 4"},
  {k:"sleep",n:"Sleep 7–8 h",v:d.habits.sleep?1:0,t:1,txt:"",manual:1},

function syncProgress(){
 const wo0=day.workout,was=wo0.done;wo0.done=trainDone(day);
 if(wo0.done&&!was){if(wo0.type==="A"||wo0.type==="B"){Object.entries(wo0.sets).forEach(([n,sets])=>{const clean=sets.filter(s=>s&&(s.w||s.r));if(clean.length)S.lifts[n]={date:day.date,sets:clean}})}toast("Training quest cleared")}

 const it=questItems(day),done=it.filter(i=>i.v>=i.t).length,q=done===it.length,wo=day.workout,str=wo.done&&["A","B"].includes(wo.type);
 const e={xp:done*10+(q?30:0)+(str?20:0)+(cdn?25:0),q:q?1:0,cd:cdn?1:0,str:str?1:0,cr:wo.done&&["walk","badminton"].includes(wo.type)?1:0,st:day.steps>=T().steps?1:0,wa:day.water>=T().water?1:0,sl:day.habits.sleep?1:0};

 const L=levelInfo().level,R=rankIdx();
 if(R>(S.rank??0)){S.rank=R;changed=true;notice("RANK UP",`You are now <b>${RANKS[R]}-rank</b>. Your 7-day average passed ${r1(T().start-(T().start-T().goal)/5*R)} kg.`)}
 else if(L>S.lvl){S.lvl=L;changed=true;notice("LEVEL UP",`Level <b>${L}</b> reached. Your stats grow with every quest you clear.`)}

 if(changed)saveState()}

const COND=[["push","Incline push-ups","reps","Hands on a bench or wall; lower the incline as you level",[5,10]],["squat","Box squats","reps","Sit back to a chair or box, stand tall",[5,10]],["core","Dead bugs or crunches","reps","Slow and controlled, lower back down",[5,10]],["walk","Walk","km","Any pace; split it through the day",[0.5,1]]];
function condTargets(){const L=Math.max(1,S.lvl||1);return{push:Math.min(100,20+3*(L-1)),squat:Math.min(100,25+3*(L-1)),core:Math.min(100,20+3*(L-1)),walk:Math.min(10,Math.round((2+0.25*(L-1))*2)/2)}}
const condOff=d=>{const R=S.roster||{};return R[d]==="night"||R[addDays(d,-1)]==="night"};
function condParts(d){const t=condTargets(),c=d.cond||{};return COND.map(([k])=>({k,v:c[k]||0,t:t[k]}))}
const condDone=d=>condOff(d.date)||condParts(d).every(p=>p.v>=p.t);
function trainObjs(d){const wo=d.workout,t=wo.type;
 if(t==="A"||t==="B")return WORKOUTS[t].map(([n,sets])=>({n,v:(wo.sets[n]||[]).filter(s=>s&&s.d).length,t:sets}));
 if(t==="walk")return[{n:"Brisk walk",v:Number(wo.mins)||0,t:40,u:"min"}];
 if(t==="badminton")return[{n:"Badminton or long walk",v:Number(wo.mins)||0,t:60,u:"min"}];
 return[{n:"Easy walk 20 min",k:"rec1",v:wo.rec1?1:0,t:1},{n:"Stretch 10 min",k:"rec2",v:wo.rec2?1:0,t:1}]}
const trainDone=d=>trainObjs(d).every(o=>o.v>=o.t);

function chart(w){
 const W=520,H=220,L=36,R=12,Tp=12,B=26;
 const end=TODAY,start=addDays(end,-89);
 const pts=w.filter(([d])=>d>=start);
 const st=T();
 if(!pts.length)return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="No weigh-ins yet"><rect x="0" y="0" width="${W}" height="${H}" fill="none"/><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="13">Your weigh-ins will draw here</text></svg>`;
 const vals=pts.map(p=>p[1]);
 let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
 if(hi-lo<4){hi+=2;lo-=2}
 const dayIdx=d=>(parse(d)-parse(start))/864e5;
 const x=d=>L+dayIdx(d)/89*(W-L-R), y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
 const step=Math.max(1,Math.ceil((hi-lo)/5));
 let g="";for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`}
 let xl="";for(let i=0;i<=3;i++){const d=addDays(start,i*30);const dd=parse(d);xl+=`<text x="${x(d)}" y="${H-8}" text-anchor="${i===0?"start":"middle"}" font-size="11" fill="var(--muted)">${dd.getDate()}/${dd.getMonth()+1}</text>`}
 const avg=pts.map(([d])=>[d,trend(d)]);
 const line=avg.map(([d,v],i)=>(i?"L":"M")+x(d).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
 const area=line+` L${x(avg[avg.length-1][0]).toFixed(1)} ${H-B} L${x(avg[0][0]).toFixed(1)} ${H-B} Z`;
 const dots=pts.map(([d,v])=>`<circle cx="${x(d).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="var(--muted)" opacity=".55"/>`).join("");
 const lastA=avg[avg.length-1];
 const nextMile=[110,100,90,80].find(m=>m<lastA[1]);
 const mile=nextMile&&nextMile>=lo?`<line x1="${L}" x2="${W-R}" y1="${y(nextMile)}" y2="${y(nextMile)}" stroke="var(--amber)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-R}" y="${y(nextMile)-5}" text-anchor="end" font-size="11" fill="var(--amber)">next: ${nextMile} kg</text>`:"";
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight trend, latest 7-day average ${r1(lastA[1])} kg">
  ${g}${xl}${mile}<path d="${area}" fill="var(--accent)" opacity=".08"/>${dots}
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="${x(lastA[0])}" cy="${y(lastA[1])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
  <text x="${Math.min(x(lastA[0]),W-R-40)}" y="${y(lastA[1])-10}" font-size="12" font-weight="600" fill="var(--ink)">${r1(lastA[1])}</text></svg>`}

async function fillReview(){

 const days=await store.range(from,to); days[cur]=day;

 el.innerHTML=`<div class="review num">

 if(b.id==="calSend"){sendAlerts();return}
 if(b.id==="backPlan"){day.workout.manual=false;saveDay();render();return}
 if(b.dataset.shift){const k=b.dataset.shift;S.roster[day.date]=S.roster[day.date]===k?"":k;saveState();toast(S.roster[day.date]?"Shift set, week re-planned":"Shift cleared");render();return}
 if(b.dataset.rweek){rosterWeek=Number(b.dataset.rweek);render();return}
 if(b.dataset.cond){const k=b.dataset.cond;day.cond=day.cond||{};day.cond[k]=Math.max(0,Math.round(((day.cond[k]||0)+Number(b.dataset.add))*10)/10);saveDay();render();return}
 if(b.dataset.mins){day.workout.mins=Math.max(0,(Number(day.workout.mins)||0)+Number(b.dataset.mins));saveDay();render();return}
 if(b.id==="woDone"){const wo=day.workout;wo.done=!wo.done;
  if(wo.done&&(wo.type==="A"||wo.type==="B")){Object.entries(wo.sets).forEach(([n,sets])=>{const clean=sets.filter(s=>s&&(s.w||s.r));if(clean.length)S.lifts[n]={date:day.date,sets:clean}});saveState()}
  saveDay();toast(wo.done?"Session done":"Marked not done");render();return}
 if(b.id==="shopReset"){if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false;if(tab==="shop")render()},4000);return}
  resetArm=false;S.shop={};saveState();toast("Ticks cleared");render();return}
});
view.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.habit){day.habits[t.dataset.habit]=t.checked;saveDay();render();return}
 if(t.dataset.shop){S.shop[t.dataset.shop]=t.checked;saveState();render();return}
 if(t.dataset.rdate){S.roster[t.dataset.rdate]=t.value;saveState();toast("Roster updated");render();return}
 if(t.id==="stepsIn"){const v=parseInt(t.value,10);if(v>=0){day.steps=v;saveDay();toast("Steps saved");render()}return}
 if(t.dataset.ex){const n=t.dataset.ex.replace(/&amp;/g,"&"),i=Number(t.dataset.i);const arr=day.workout.sets[n]=day.workout.sets[n]||[];
  arr[i]=arr[i]||{};arr[i][t.dataset.f]=t.value===""?"":Number(t.value);
  if(t.dataset.f==="r"&&Number(t.value)>0&&!arr[i].d){arr[i].d=true;const cb=view.querySelector(`[data-exd="${CSS.escape(t.dataset.ex)}"][data-i="${i}"]`);if(cb)cb.checked=true;
   const pr=view.querySelector(`[data-prog="${CSS.escape(t.dataset.ex)}"]`);const ex=WORKOUTS[day.workout.type]?.find(x=>x[0]===n);if(pr&&ex)pr.textContent=`${arr.filter(s=>s&&s.d).length} / ${ex[1]} sets · ${ex[2]}`}
  saveDay();if(day.workout.done&&tab==="train")render();return}
 if(t.dataset.exd){const n=t.dataset.exd.replace(/&amp;/g,"&"),i=Number(t.dataset.i);const arr=day.workout.sets[n]=day.workout.sets[n]||[];arr[i]=arr[i]||{};arr[i].d=t.checked;saveDay();render();return}
 if(t.dataset.rec){day.workout[t.dataset.rec]=t.checked;saveDay();render();return}
 if(t.id==="minsIn"){day.workout.mins=t.value;saveDay();return}
 if(t.id&&t.id.startsWith("t-")){const k=t.id.slice(2),v=Number(t.value);if(v>0){S.settings[k]=v;saveState();toast("Target updated");render()}return}
});
view.addEventListener("submit",e=>{e.preventDefault();
 if(e.target.id==="customF"){const n=$("#cN").value.trim(),k=parseInt($("#cK").value,10),p=parseInt($("#cP").value||"0",10);
  if(!n||!(k>=0))return;day.foods.push({n,k,p:p||0});saveDay();toast("Added "+n);render();return}
 if(e.target.id==="mF"){const m={date:day.date};let any=false;["waist","chest","hips","arm","thigh"].forEach(k=>{const v=parseFloat($("#m-"+k).value);if(v>0){m[k]=v;any=true}});
  if(!any){toast("Enter at least one measurement");return}
  S.measures=S.measures.filter(x=>x.date!==m.date);S.measures.push(m);S.measures.sort((a,b)=>a.date<b.date?-1:1);saveState();toast("Measurements saved");render()}
});

/* ---------- boot ---------- */
(async()=>{
 const local=store.lget("state");if(local)S={...S,...local,settings:{...DEFAULTS,...(local.settings||{})}};
 day=store.lget("d-"+TODAY)||blankDay(TODAY);route();
 const timer=setTimeout(()=>setSync("Saving on this device"),10000);
 await store.init();clearTimeout(timer);
 if(store.mode==="cloud"){
  setSync("Loading your data…");
  const cs=await store.get("state");
  if(cs)S={...S,...cs,settings:{...DEFAULTS,...(cs.settings||{})}};
  else if(local)store.save("state",S);
  const cd=await store.get("d-"+cur);
  if(cd)day={...blankDay(cur),...cd};else if(day.foods.length||Object.keys(day.habits).length)saveDay();
  setSync("Synced to your account");
 }else setSync("Saved on this phone");
 if(!S.since)S.since=TODAY;
 if(!S.lvl)S.lvl=levelInfo().level;
 if(S.rank==null)S.rank=rankIdx();
 render();
 setInterval(()=>{if(!document.hidden)tick()},30000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
})();

/* ---------- installed-app extras ---------- */
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
const _toast=toast;
toast=function(t){_toast(t);try{if(document.hidden&&"Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification("Cut Tracker",{body:t,icon:"icon-192.png",tag:t}))}catch(e){}};
setInterval(()=>tick(),60000);
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
sendAlerts=async function(){const st=$("#calStatus");const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cut Tracker//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
 const f=(d,h,m)=>d.replace(/-/g,"")+"T"+pad(h)+pad(m)+"00";const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";let n=0;
 const clean=s=>String(s).replace(/[\\,;]/g,m=>"\\"+m);
 const ev=(uid,s,e,sum,desc,mins)=>{L.push("BEGIN:VEVENT","UID:"+uid+"@cut-tracker","DTSTAMP:"+stamp,"DTSTART:"+s,"DTEND:"+e,"SUMMARY:"+clean(sum),"DESCRIPTION:"+clean(desc),"TRANSP:TRANSPARENT","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+clean(sum),"TRIGGER:-PT"+mins+"M","END:VALARM","END:VEVENT");n++};
 for(let i=0;i<7;i++){const d=addDays(TODAY,i),plan=scheduled(d),win=trainWindow(d);
  ev(d+"-q",f(d,21,30),f(d,21,45),"Daily Quest closes in 2 h","Open Cut Tracker and clear the lines you have left.",0);
  if(plan!=="rest"&&win){const e=new Date(win.open.getTime()+36e5);ev(d+"-t",f(d,win.open.getHours(),win.open.getMinutes()),f(d,e.getHours(),e.getMinutes()),"Training Quest: "+planLabel(plan),shiftTip(d),15)}}
 L.push("END:VCALENDAR");dl("quest-alerts-"+TODAY+".ics",L.join("\r\n"),"text/calendar");
 st.textContent=`Downloaded ${n} reminders. Open the file and pick Google Calendar to add them. Re-download after changing shifts; matching events update instead of doubling.`};
const _vPlan=VIEWS.plan;
VIEWS.plan=function(){const perm="Notification" in window?Notification.permission:"unsupported";
 const card=`<section class="sys"><div class="sys-h"><span>APP DATA</span><span>THIS PHONE</span></div>
  <p class="small" style="margin:0">Your data lives on this phone. Export a backup now and then, and import it if you reinstall or switch phones.</p>
  <div class="row"><button class="btn" id="expBk">Export backup</button><label class="btn" for="impBk" style="cursor:pointer">Import backup</label><input type="file" id="impBk" accept="application/json,.json" hidden></div>
  <button class="btn ${perm==="granted"?"":"primary"}" id="notifOn" ${perm==="granted"||perm==="unsupported"?"disabled":""}>${perm==="granted"?"Notifications on":perm==="unsupported"?"Notifications not supported here":"Turn on notifications"}</button>
  <span class="muted small" id="appStatus" role="status">Notifications fire while the app is open or recently in the background. For alarms that always ring, use the calendar alerts above.</span>
 </section>`;
 return _vPlan().replace('<section class="card"><h3>Build every plate</h3>',card+'<section class="card"><h3>Build every plate</h3>')};
view.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="expBk"){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("cut:"))o[k]=localStorage.getItem(k)}
  dl("cut-tracker-backup-"+TODAY+".json",JSON.stringify(o),"application/json");$("#appStatus").textContent="Backup saved to your downloads."}
 if(b.id==="notifOn"){try{const p=await Notification.requestPermission();render();$("#appStatus").textContent=p==="granted"?"Notifications on.":"Notifications were blocked. Allow them in your phone's app settings."}catch(err){}}});
view.addEventListener("change",e=>{if(e.target.id!=="impBk")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);let n=0;Object.entries(o).forEach(([k,v])=>{if(k.startsWith("cut:")){localStorage.setItem(k,v);n++}});$("#appStatus").textContent=`Imported ${n} records. Reloading…`;setTimeout(()=>location.reload(),600)}catch(err){$("#appStatus").textContent="That file isn't a Cut Tracker backup."}};r.readAsText(f)});
</script>
